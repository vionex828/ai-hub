<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='8' fill='%23111513'/%3E%3Ccircle cx='10.8' cy='14' r='5' fill='none' stroke='white' stroke-width='2.2'/%3E%3Ccircle cx='17.2' cy='14' r='5' fill='none' stroke='white' stroke-width='2.2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app" style="overflow-y:auto">
  <section class="lg-side" id="a-login" hidden style="min-height:100%">
    <form class="lg-card lg-form" id="fAdmin" novalidate>
      <div class="brand"><svg class="mark" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect class="m-bg" width="28" height="28" rx="8"/><circle class="m-c" cx="10.8" cy="14" r="5"/><circle class="m-c" cx="17.2" cy="14" r="5"/></svg><span>Admin</span></div>
      <div><h2>Owner login</h2><p class="sub">Use the ADMIN_PASSWORD you set in Railway.</p></div>
      <label class="lbl" for="apw">Password</label>
      <input class="inp" id="apw" type="password" autocomplete="current-password" style="width:100%;height:48px;text-align:left;font-size:16px">
      <p class="err" id="aErr" hidden></p>
      <button class="btn btn-pri btn-lg btn-block" type="submit">Log in</button>
    </form>
  </section>

  <div id="a-app" hidden>
    <div class="page-body" style="overflow:visible">
      <div class="page" style="gap:28px;max-width:1280px">
        <div class="pg-h" style="flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
          <div class="brand" style="font-size:20px"><svg class="mark" width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><rect class="m-bg" width="28" height="28" rx="8"/><circle class="m-c" cx="10.8" cy="14" r="5"/><circle class="m-c" cx="17.2" cy="14" r="5"/></svg><span id="aBrand">Admin</span></div>
          <div style="display:flex;gap:8px"><a class="btn btn-out btn-sm" href="/" target="_blank" rel="noopener">Open site</a><button class="btn btn-out btn-sm" id="aLogout"><i data-ic="log-out"></i>Log out</button></div>
        </div>
        <nav class="tabs" id="tabs">
          <button data-tab="overview" class="on">Overview</button>
          <button data-tab="models">Models</button>
          <button data-tab="plans">Plans &amp; profit</button>
          <button data-tab="users">Customers</button>
          <button data-tab="payments">Payments</button>
          <button data-tab="settings">Settings</button>
        </nav>
        <div id="tab"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/icons.js"></script>
<script src="/admin.js"></script>
</body>
</html>
